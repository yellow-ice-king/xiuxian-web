<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#10151d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="修仙搜打撤" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/app-icon-192.png" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="data:,">
  <title>修仙搜打撤 · 水墨秘境</title>
  <style>
    html,
    body {
      margin: 0;
      background: #10151d;
      overscroll-behavior: none;
    }

    #boot {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d5d9e0;
      font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    }

    .boot-inner {
      text-align: center;
      padding: 24px;
    }

    .boot-inner.error {
      color: #e59a8f;
      max-width: 640px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="boot">正在加载《修仙搜打撤》...</div>
  <script src="./game.bundle.js"></script>
  <script src="./runtime.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        navigator.serviceWorker.register('./sw.js').then(function () {
          console.log('SW registered');
        }).catch(function (err) {
          console.warn('SW register failed', err && err.message);
        });
      } else {
        window.addEventListener('DOMContentLoaded', function () {
          navigator.serviceWorker.register('./sw.js').then(function () {
            console.log('SW registered');
          }).catch(function (err) {
            console.warn('SW register failed', err && err.message);
          });
        });
      }
    }
  </script>
</body>
</html>
